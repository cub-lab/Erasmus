# Configurare nginx pentru LogicLab pe un SUBDOMENIU (de ex. logiclab.domeniul-tau.ro).
# nginx primește vizitatorii și îi trimite mai departe către Streamlit (portul intern 8502).
#
# Instalare:  sudo cp deploy/nginx-logiclab.conf /etc/nginx/sites-available/logiclab
#             sudo ln -s /etc/nginx/sites-available/logiclab /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name logiclab.DOMENIUL_TAU.ro;   # <- schimbă cu subdomeniul tău

    location / {
        proxy_pass http://127.0.0.1:8502;

        # Streamlit ține o conexiune permanentă (WebSocket) cu browserul.
        # Fără aceste linii, pagina rămâne blocată la „Connecting...”.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

